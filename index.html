<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">

  <title>Aprovisionamientos</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --bg:#f1f5f9;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --dark:#0f172a;
      --green:#16a34a;
      --greenSoft:#dcfce7;
      --red:#dc2626;
      --redSoft:#fee2e2;
      --amber:#d97706;
      --amberSoft:#fef3c7;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top, #dbeafe 0, transparent 32%),
        var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    .app{
      max-width:560px;
      margin:auto;
      padding:18px 12px 42px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .title h1{
      margin:0;
      font-size:23px;
      letter-spacing:-.4px;
    }

    .title .sub{
      margin-top:3px;
      color:var(--muted);
      font-size:13px;
    }

    .session{
      text-align:right;
      font-size:12px;
      color:var(--muted);
      max-width:210px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .card{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.8);
      border-radius:22px;
      box-shadow:0 12px 34px rgba(15,23,42,.08);
      overflow:hidden;
    }

    .scanner-shell{
      padding:14px;
      transition:
        background .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
    }

    .scanner-shell.flash-ok{
      background:var(--greenSoft);
      box-shadow:0 0 0 3px rgba(22,163,74,.18);
      transform:scale(.997);
    }

    .scanner-shell.flash-error{
      background:var(--redSoft);
      box-shadow:0 0 0 3px rgba(220,38,38,.16);
    }

    #reader{
      width:100%;
      min-height:310px;
      border-radius:18px;
      overflow:hidden;
      background:#020617;
    }

    #reader video{
      border-radius:18px!important;
      object-fit:cover!important;
    }

    .camera-off{
      min-height:310px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      text-align:center;
      background:#0f172a;
      color:white;
      padding:24px;
    }

    .camera-icon{
      font-size:42px;
    }

    button{
      border:0;
      border-radius:14px;
      padding:13px 16px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .primary{
      background:#fff;
      color:#0f172a;
    }

    .dark{
      background:var(--dark);
      color:#fff;
      width:100%;
    }

    .status{
      margin:12px 14px 14px;
      border-radius:16px;
      padding:13px 14px;
      background:#f8fafc;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:11px;
    }

    .status-dot{
      width:11px;
      height:11px;
      flex:0 0 11px;
      border-radius:50%;
      background:#94a3b8;
    }

    .status.ok .status-dot{background:var(--green)}
    .status.wait .status-dot{background:var(--amber)}
    .status.error .status-dot{background:var(--red)}

    .status-main{
      font-size:14px;
      font-weight:800;
    }

    .status-sub{
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
    }

    .recent{
      margin-top:14px;
      background:rgba(255,255,255,.9);
      border-radius:20px;
      box-shadow:0 8px 28px rgba(15,23,42,.06);
      padding:15px;
    }

    .recent-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
    }

    .recent-head strong{
      font-size:14px;
    }

    .counter{
      background:#e2e8f0;
      border-radius:999px;
      padding:5px 9px;
      font-size:12px;
      font-weight:800;
    }

    .scan-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 4px;
      border-top:1px solid var(--line);
    }

    .scan-row:first-of-type{
      border-top:0;
    }

    .scan-code{
      font-weight:900;
      font-size:14px;
      word-break:break-all;
    }

    .scan-time{
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
    }

    .check{
      color:var(--green);
      font-weight:900;
      font-size:19px;
    }

    .empty{
      color:var(--muted);
      font-size:13px;
      padding:12px 3px 4px;
    }

    .login{
      min-height:75vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-card{
      width:min(420px,100%);
      background:#fff;
      border-radius:24px;
      padding:26px 22px;
      box-shadow:0 18px 50px rgba(15,23,42,.12);
      text-align:center;
    }

    .login-logo{
      width:64px;
      height:64px;
      margin:0 auto 14px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0f172a;
      color:#fff;
      font-size:30px;
    }

    .login-card h2{
      margin:0;
      font-size:22px;
    }

    .login-card p{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
      margin:8px 0 18px;
    }

    #googleButton{
      display:flex;
      justify-content:center;
    }

    .manual{
      margin-top:12px;
      display:flex;
      gap:8px;
    }

    .manual input{
      flex:1;
      min-width:0;
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px;
      font-size:15px;
    }

    .manual button{
      background:#e2e8f0;
      color:#0f172a;
      white-space:nowrap;
    }

    .link-btn{
      margin-top:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#64748b;
      font-size:12px;
      padding:7px;
    }

    .hidden{display:none!important}

    iframe.backend-frame{
      position:absolute;
      width:1px;
      height:1px;
      border:0;
      left:-9999px;
      top:-9999px;
    }

    @media(max-width:430px){
      .app{padding:12px 8px 34px}
      .scanner-shell{padding:9px}
      #reader,.camera-off{min-height:58vh}
      .title h1{font-size:20px}
    }
  </style>
</head>

<body>

<section id="loginView" class="login">
  <div class="login-card">
    <div class="login-logo">▣</div>
    <h2>Aprovisionamientos</h2>
    <p>
      Ingresa con tu cuenta de Google. Después la aplicación abrirá
      directamente el escáner.
    </p>
    <div id="googleButton"></div>
    <div id="loginMsg" style="margin-top:12px;color:#dc2626;font-size:13px"></div>
  </div>
</section>

<main id="appView" class="app hidden">

  <div class="top">
    <div class="title">
      <h1>Aprovisionamientos</h1>
      <div class="sub">Escanea y continúa</div>
    </div>

    <div class="session" id="sessionEmail"></div>
  </div>

  <section class="card">
    <div id="scannerShell" class="scanner-shell">

      <div id="reader"></div>

      <div id="cameraOff" class="camera-off hidden">
        <div class="camera-icon">📷</div>
        <strong>Activa la cámara</strong>
        <div style="font-size:13px;color:#cbd5e1">
          Solo se necesita una vez en este dispositivo.
        </div>
        <button class="primary" onclick="iniciarCamara()">
          ABRIR ESCÁNER
        </button>
      </div>

    </div>

    <div id="statusBox" class="status">
      <div class="status-dot"></div>
      <div>
        <div id="statusMain" class="status-main">Preparando escáner...</div>
        <div id="statusSub" class="status-sub"></div>
      </div>
    </div>
  </section>

  <section class="recent">
    <div class="recent-head">
      <strong>Últimos registros</strong>
      <span id="counter" class="counter">0</span>
    </div>

    <div id="recentList">
      <div class="empty">Todavía no has escaneado nada.</div>
    </div>

    <button id="manualToggle" class="link-btn" onclick="toggleManual()">
      Captura manual
    </button>

    <div id="manualBox" class="manual hidden">
      <input
        id="manualSku"
        autocomplete="off"
        inputmode="numeric"
        placeholder="Escribe SKU"
      >
      <button onclick="registrarManual()">Registrar</button>
    </div>
  </section>

</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwxLnWaSq2SosMGELgnIdBv3URvlhWCfXtzYC4NKmHnK_cUDmtYHhPAO5H6DBaqZeVahw/exec';

  let appConfig = null;
  let googleCredential = '';
  let usuario = null;
  let scanner = null;
  let scannerActivo = false;

  const bloqueados = new Map();
  const peticiones = new Map();
  const recientes = [];

  document.addEventListener('DOMContentLoaded', iniciar);

  async function iniciar(){
    window.addEventListener('message', recibirBackend);

    try{
      const r = await jsonp('config');

      if(!r.ok){
        throw new Error(r.error || 'No se pudo cargar configuración.');
      }

      appConfig = r.data || {};

      if(
        !appConfig.googleClientId ||
        appConfig.googleClientId === 'PEGA_AQUI_TU_CLIENT_ID_DE_GOOGLE'
      ){
        throw new Error(
          'Falta configurar GOOGLE_CLIENT_ID en la pestaña CONFIG.'
        );
      }

      esperarGoogle();

    }catch(err){
      document.getElementById('loginMsg').textContent = err.message;
    }
  }

  function esperarGoogle(){
    let intentos = 0;

    const timer = setInterval(() => {
      intentos++;

      if(window.google && google.accounts && google.accounts.id){
        clearInterval(timer);
        prepararGoogle();
        return;
      }

      if(intentos > 80){
        clearInterval(timer);
        document.getElementById('loginMsg').textContent =
          'No se pudo cargar el acceso con Google.';
      }
    }, 100);
  }

  function prepararGoogle(){
    google.accounts.id.initialize({
      client_id: appConfig.googleClientId,
      callback: onGoogleCredential,
      auto_select: true,
      cancel_on_tap_outside: false
    });

    google.accounts.id.renderButton(
      document.getElementById('googleButton'),
      {
        theme:'outline',
        size:'large',
        shape:'pill',
        width:300,
        text:'continue_with'
      }
    );

    google.accounts.id.prompt();
  }

  function onGoogleCredential(resp){
    if(!resp || !resp.credential){
      document.getElementById('loginMsg').textContent =
        'No se pudo identificar la cuenta.';
      return;
    }

    try{
      const payload = decodificarJwt(resp.credential);

      googleCredential = resp.credential;
      usuario = {
        email: payload.email || '',
        name: payload.name || ''
      };

      if(!usuario.email){
        throw new Error('Google no devolvió el correo.');
      }

      document.getElementById('sessionEmail').textContent = usuario.email;

      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');

      setStatus(
        'Listo para escanear',
        'La fecha, hora y usuario se guardan automáticamente.',
        'ok'
      );

      iniciarCamara();

    }catch(err){
      document.getElementById('loginMsg').textContent = err.message;
    }
  }

  async function iniciarCamara(){
    if(scannerActivo) return;

    document.getElementById('cameraOff').classList.add('hidden');
    document.getElementById('reader').classList.remove('hidden');

    try{
      scanner = new Html5Qrcode(
        'reader',
        {
          formatsToSupport:[
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        }
      );

      await scanner.start(
        { facingMode:'environment' },
        {
          fps:12,
          qrbox:{width:280,height:125},
          aspectRatio:1.6
        },
        codigo => {
          detectarCodigo(codigo);
        },
        () => {}
      );

      scannerActivo = true;

      setStatus(
        'Escáner activo',
        'Apunta al código. No necesitas presionar ningún botón.',
        'ok'
      );

    }catch(err){
      scannerActivo = false;
      scanner = null;

      document.getElementById('reader').classList.add('hidden');
      document.getElementById('cameraOff').classList.remove('hidden');

      setStatus(
        'Cámara sin permiso',
        'Toca “Abrir escáner” y permite el acceso a la cámara.',
        'error'
      );
    }
  }

  function detectarCodigo(raw){
    const sku = String(raw || '').trim();

    if(!sku || !googleCredential) return;

    const ahora = Date.now();
    const hasta = bloqueados.get(sku) || 0;

    if(ahora < hasta) return;

    bloqueados.set(sku, ahora + 2500);

    setStatus(
      'Código detectado',
      sku + ' · guardando...',
      'wait'
    );

    enviarRegistro(sku)
      .then(result => {
        flashOk();

        setStatus(
          'Registrado',
          result.sku + ' · ' + result.hora,
          'ok'
        );

        agregarReciente(result);

        try{
          if(navigator.vibrate) navigator.vibrate(80);
        }catch(e){}

        beep();

      })
      .catch(err => {
        bloqueados.delete(sku);
        flashError();

        setStatus(
          'No se pudo guardar',
          err.message || String(err),
          'error'
        );
      });
  }

  function enviarRegistro(sku){
    return new Promise((resolve,reject) => {
      const requestId =
        'APR-' +
        Date.now().toString(36) +
        '-' +
        Math.random().toString(36).slice(2,9);

      const frameName = 'frame_' + requestId.replace(/[^a-zA-Z0-9_]/g,'_');

      const iframe = document.createElement('iframe');
      iframe.name = frameName;
      iframe.className = 'backend-frame';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = API_URL;
      form.target = frameName;
      form.className = 'hidden';

      const payloadInput = document.createElement('input');
      payloadInput.type = 'hidden';
      payloadInput.name = 'payload';
      payloadInput.value = JSON.stringify({
        sku:sku,
        credential:googleCredential
      });

      const requestInput = document.createElement('input');
      requestInput.type = 'hidden';
      requestInput.name = 'requestId';
      requestInput.value = requestId;

      form.appendChild(payloadInput);
      form.appendChild(requestInput);
      document.body.appendChild(form);

      const timeout = setTimeout(() => {
        limpiarPeticion(requestId);
        reject(
          new Error(
            'Sin respuesta del servidor. Revisa conexión antes de repetir.'
          )
        );
      }, 15000);

      peticiones.set(requestId,{
        resolve,
        reject,
        timeout,
        iframe,
        form
      });

      form.submit();
    });
  }

  function recibirBackend(event){
    const msg = event.data;

    if(
      !msg ||
      typeof msg !== 'object' ||
      msg.type !== 'APROVISIONAMIENTO_GUARDADO'
    ){
      return;
    }

    const req = peticiones.get(msg.requestId);

    if(!req) return;

    if(msg.ok){
      req.resolve(msg.result);
    }else{
      req.reject(new Error(msg.error || 'No se pudo guardar.'));
    }

    limpiarPeticion(msg.requestId);
  }

  function limpiarPeticion(requestId){
    const req = peticiones.get(requestId);

    if(!req) return;

    clearTimeout(req.timeout);

    setTimeout(() => {
      try{req.form.remove();}catch(e){}
      try{req.iframe.remove();}catch(e){}
    }, 150);

    peticiones.delete(requestId);
  }

  function agregarReciente(result){
    recientes.unshift(result);

    if(recientes.length > 5){
      recientes.pop();
    }

    document.getElementById('counter').textContent =
      String(Number(document.getElementById('counter').textContent || 0) + 1);

    const box = document.getElementById('recentList');
    box.innerHTML = '';

    recientes.forEach(r => {
      const row = document.createElement('div');
      row.className = 'scan-row';

      row.innerHTML = `
        <div>
          <div class="scan-code">${esc(r.sku)}</div>
          <div class="scan-time">${esc(r.hora || '')}</div>
        </div>
        <div class="check">✓</div>
      `;

      box.appendChild(row);
    });
  }

  function setStatus(main,sub,tipo){
    const box = document.getElementById('statusBox');

    box.className = 'status' + (tipo ? ' ' + tipo : '');

    document.getElementById('statusMain').textContent = main || '';
    document.getElementById('statusSub').textContent = sub || '';
  }

  function flashOk(){
    const el = document.getElementById('scannerShell');

    el.classList.remove('flash-error');
    el.classList.add('flash-ok');

    setTimeout(() => {
      el.classList.remove('flash-ok');
    }, 750);
  }

  function flashError(){
    const el = document.getElementById('scannerShell');

    el.classList.remove('flash-ok');
    el.classList.add('flash-error');

    setTimeout(() => {
      el.classList.remove('flash-error');
    }, 1100);
  }

  function beep(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.frequency.value = 760;
      gain.gain.value = .045;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + .07);

      setTimeout(() => ctx.close(), 180);
    }catch(e){}
  }

  function toggleManual(){
    document.getElementById('manualBox').classList.toggle('hidden');
  }

  function registrarManual(){
    const input = document.getElementById('manualSku');
    const sku = String(input.value || '').trim();

    if(!sku) return;

    input.value = '';
    detectarCodigo(sku);
  }

  function decodificarJwt(token){
    const parte = token.split('.')[1];

    if(!parte) throw new Error('Credencial de Google inválida.');

    const base64 = parte.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(
      atob(base64)
        .split('')
        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
        .join('')
    );

    return JSON.parse(json);
  }

  function jsonp(action,params={}){
    return new Promise((resolve,reject) => {
      const callback =
        '__cb_' +
        Date.now() +
        '_' +
        Math.random().toString(36).slice(2);

      const query = new URLSearchParams({
        action,
        callback,
        _:Date.now().toString(),
        ...params
      });

      const script = document.createElement('script');

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('No respondió Apps Script.'));
      },12000);

      function cleanup(){
        clearTimeout(timer);

        try{delete window[callback];}catch(e){
          window[callback] = undefined;
        }

        try{script.remove();}catch(e){}
      }

      window[callback] = data => {
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error('No se pudo conectar con Apps Script.'));
      };

      script.src = API_URL + '?' + query.toString();
      document.body.appendChild(script);
    });
  }

  function esc(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
